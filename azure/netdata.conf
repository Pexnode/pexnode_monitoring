[global]
  # Netdata parent node configuration
  run as user = netdata
  
  # Bind to all interfaces for Azure Container
  bind socket to IP = 0.0.0.0
  bind to = 0.0.0.0:19999
  
  # Performance tuning
  memory mode = save
  history = 3600  # 1 hour of detailed data
  
  # Disable telemetry
  send anonymous statistics = no
  
  # API settings
  enable running new plugins = no
  
[db]
  # Store 1 hour of data in memory, older data on disk
  update every = 1
  
[plugins]
  # Disable collectors we don't need on parent
  charts.d = no
  ebpf = no
  
[streaming]
  # Accept connections from children
  enabled = yes
  listen backlog = 4096
