# Netdata health alarm notification configuration
# Mounted into the container at /etc/netdata/health_alarm_notify.conf
#
# DISCORD_WEBHOOK_OPS must be set as an environment variable in docker-compose.yml
# (sourced from the .env file on the Azure host).

# ---------------------------------------------------------------------------
# Discord
# ---------------------------------------------------------------------------

SEND_DISCORD="YES"

# Full Discord webhook URL (injected from container environment)
DISCORD_WEBHOOK_URL="${DISCORD_WEBHOOK_OPS}"

# Default role to notify — maps to DEFAULT_RECIPIENT_DISCORD below.
# All critical/warning/clear alerts go to this webhook.
DEFAULT_RECIPIENT_DISCORD="sysadmin"

# Role → webhook routing (all roles point to the same ops webhook for now)
role_recipients_discord[sysadmin]="${DISCORD_WEBHOOK_OPS}"
role_recipients_discord[domainadmin]="${DISCORD_WEBHOOK_OPS}"
role_recipients_discord[dba]="${DISCORD_WEBHOOK_OPS}"
role_recipients_discord[webmaster]="${DISCORD_WEBHOOK_OPS}"
role_recipients_discord[proxyadmin]="${DISCORD_WEBHOOK_OPS}"
role_recipients_discord[sitemgr]="${DISCORD_WEBHOOK_OPS}"

# ---------------------------------------------------------------------------
# Disable other notification channels
# ---------------------------------------------------------------------------

SEND_EMAIL="NO"
SEND_SLACK="NO"
SEND_PAGERDUTY="NO"
SEND_OPSGENIE="NO"
SEND_TWILIO="NO"
SEND_TELEGRAM="NO"
SEND_PUSHOVER="NO"
