name: Monitoring CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shell-checks:
    name: Shell Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find scripts -type f -name '*.sh' -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell scripts found under scripts/."
            exit 0
          fi
          bash -n "${files[@]}"

      - name: Shellcheck
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find scripts -type f -name '*.sh' -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell scripts found under scripts/."
            exit 0
          fi
          shellcheck -x "${files[@]}"
