# Pexnode region → cloud provider mapping
#
# Columns (whitespace-separated, no spaces within a field):
#   REGION_ID   PROVIDER   LOCATION   SERVER_TYPE   ALLOC_START   ALLOC_END   CUSTOMER_LABEL   DEDICATED_RECOMMEND
#
# REGION_ID:       Internal ID used by scripts and WHMCS config
# PROVIDER:        hetzner | vultr
# LOCATION:        Hetzner location code or Vultr region ID
# SERVER_TYPE:     Hetzner server type or Vultr plan ID (dedicated vCPU only — never shared)
# ALLOC_START/END: Port range reserved for this node in Pterodactyl
# CUSTOMER_LABEL:  Human-readable region name shown to customers (underscores = spaces)
# DEDICATED_RECOMMEND: What dedicated server to order when this region grows (for ops alerts)
#
# Hetzner CCX (dedicated vCPU, AMD EPYC) — EU only:
#   ccx13  2vCPU   8GB  ~€13/mo   2-3 game servers
#   ccx23  4vCPU  16GB  ~€25/mo   4-6 game servers  ← EU starter
#   ccx33  8vCPU  32GB  ~€50/mo   8-12 game servers
#   ccx43 16vCPU  64GB ~€100/mo   20-30 game servers ← EU dedicated target
#
# Vultr vc2 (dedicated vCPU):
#   vc2-4c-8gb   4vCPU   8GB  ~$40/mo   3-5 game servers  ← non-EU starter
#   vc2-8c-16gb  8vCPU  16GB  ~$80/mo   8-12 game servers
#
# To add a new region:
#   1. Add a line below with a unique REGION_ID and ALLOC range (500-port blocks)
#   2. Add the region to WHMCS product location options
#   3. Run: ./scripts/create-cloud-node.sh <REGION_ID> --dry-run
#   4. Run: ./scripts/create-cloud-node.sh <REGION_ID>

# Launch topology (2026-06):
#   • EU (eu-central) and US (us-east) run on DEDICATED servers — nodes are
#     registered manually as wings-eu-central-01 / wings-us-east-01. The
#     auto-provisioning worker never creates a VPS for these because a usable
#     node already exists. The PROVIDER/LOCATION fields below are only the
#     fall-back recipe if a dedicated region ever needs an emergency VPS.
#   • Asia (ap-southeast, ap-northeast) runs on VPS, auto-provisioned on demand.
#   • us-east is currently the single US region. It will be split into
#     us-east (USE) and us-west (USW) later — us-west is parked below until then.
#
# REGION_ID     PROVIDER  LOCATION  SERVER_TYPE   ALLOC_START  ALLOC_END  CUSTOMER_LABEL          DEDICATED_RECOMMEND
eu-central      hetzner   hel1      ccx23         27000        27499      Europa                  Hetzner-AX42-~€55/mnd            # DEDICATED
us-east         vultr     ewr       vc2-4c-8gb    27500        27999      Nord-Amerika            OVH-Rise1-eller-Hetzner-ASH-~$65/mnd # DEDICATED (USE; split USW later)
ap-southeast    vultr     sgp       vc2-4c-8gb    28500        28999      Asia-Stillehavet        OVH-Singapore-~$100/mnd         # VPS
ap-northeast    vultr     nrt       vc2-4c-8gb    29000        29499      Asia-Japan-Korea        OVH-Singapore-eller-Vultr-Tokyo-~$100/mnd # VPS

# Reserved for future expansion — uncomment and configure when needed
# us-west      vultr     lax       vc2-4c-8gb    28000        28499      Nord-Amerika-Vest       OVH-Rise1-~$65/mnd
# au           vultr     syd       vc2-4c-8gb    29500        29999      Australia               Vultr-Bare-Metal-Sydney-~$120/mnd
# sa           vultr     sao       vc2-4c-8gb    30000        30499      Sør-Amerika             Vultr-Bare-Metal-Sao-Paulo-~$120/mnd
# eu-west      vultr     lhr       vc2-4c-8gb    30500        30999      Europa-Vest             OVH-London-~$65/mnd
# us-central   vultr     ord       vc2-4c-8gb    31000        31499      Nord-Amerika-Sentral    OVH-Rise1-~$65/mnd
# af           vultr     jnb       vc2-4c-8gb    31500        31999      Afrika                  Vultr-Bare-Metal-Johannesburg-~$120/mnd
