# Wings game server node health overrides
# Tuned for Pterodactyl Wings hosts running multiple game server containers.
# File is mounted into the Netdata child container via enroll-host.sh.

# ---------------------------------------------------------------------------
# CPU — game servers legitimately run hot; raise thresholds to reduce noise
# Overrides default template: 10min_cpu_usage (warn 75% / crit 85%)
# ---------------------------------------------------------------------------
   template: 10min_cpu_usage
         on: system.cpu
      class: Utilization
       type: System
  component: CPU
host labels: _os=linux
     lookup: average -10m unaligned of user,system,softirq,irq,guest
      units: %
      every: 1m
       warn: $this > (($status >= $WARNING)  ? (85) : (92))
       crit: $this > (($status == $CRITICAL) ? (92) : (98))
      delay: down 15m multiplier 1.5 max 1h
    summary: Wings game server CPU utilization
       info: Average CPU > 85% for 10 minutes on Wings game server host
         to: sysadmin

# ---------------------------------------------------------------------------
# I/O wait — game servers are disk-intensive; raise threshold to reduce noise
# Overrides default template: 10min_cpu_iowait (warn 20% / crit none)
# ---------------------------------------------------------------------------
   template: 10min_cpu_iowait
         on: system.cpu
      class: Utilization
       type: System
  component: CPU
host labels: _os=linux
     lookup: average -10m unaligned of iowait
      units: %
      every: 1m
       warn: $this > (($status >= $WARNING)  ? (40) : (60))
       crit: $this > (($status == $CRITICAL) ? (60) : (75))
      delay: up 30m down 30m multiplier 1.5 max 2h
    summary: Wings I/O wait high
       info: Sustained high I/O wait on Wings game server — disk may be saturated
         to: sysadmin

# ---------------------------------------------------------------------------
# Game data disk — alert when root/data partition fills up
# Game server files (/var/lib/pterodactyl) can grow rapidly
# Overrides default disk alarm thresholds with tighter limits
# ---------------------------------------------------------------------------
template: disk_space_usage
      on: disk.space
  lookup: max -1m unaligned of used
   units: %
   every: 1m
   calc: $used * 100 / ($avail + $used)
    warn: $this > (($status >= $WARNING)  ? (80) : (85))
    crit: $this > (($status == $CRITICAL) ? (90) : (95))
   delay: down 15m multiplier 1.5 max 1h
 summary: Wings game data disk usage high
    info: Disk usage high on Wings node — game server files may be filling up
      to: sysadmin

# ---------------------------------------------------------------------------
# RAM — capacity planning for Wings hosts
# Overrides default ram_in_use (instantaneous 80%/90%).
# Uses 5-minute rolling average: brief startup spikes don't fire, but
# sustained high usage during gameplay does. A warning means plan for a
# new Wings node; critical means provision one urgently.
# ---------------------------------------------------------------------------
   alarm: ram_in_use
      on: system.ram
   class: Utilization
    type: System
component: Memory
host labels: _os=linux
  lookup: average -5m unaligned of used
    calc: $this * 100 / ($used + $cached + $free + $buffers)
   units: %
   every: 1m
    warn: $this > (($status >= $WARNING)  ? (75) : (80))
    crit: $this > (($status == $CRITICAL) ? (85) : (90))
   delay: down 30m multiplier 1.5 max 2h
 summary: Wings node RAM utilization (5min avg)
    info: 5-minute average RAM > 80% on a Wings node — this host is approaching capacity and a new Wings node may need to be provisioned.
      to: sysadmin

# ---------------------------------------------------------------------------
# Swap — game servers must never use swap; swap = severe player lag
# ---------------------------------------------------------------------------
   alarm: swap_in_use
      on: system.swap
   class: Utilization
    type: System
component: Memory
host labels: _os=linux
    calc: ($used + $free) > 0 ? ($used * 100 / ($used + $free)) : 0
   units: %
   every: 1m
    warn: $this > 0
    crit: $this > 5
   delay: down 5m
 summary: Wings node swap in use
    info: Game servers should not use swap. Swap usage causes severe game lag and indicates RAM exhaustion — provision a new Wings node immediately.
      to: sysadmin

# ---------------------------------------------------------------------------
# OOM kills — kernel terminated a process due to RAM exhaustion
# ---------------------------------------------------------------------------
   alarm: oom_kill
      on: mem.oom_kill
   class: Errors
    type: System
component: Memory
host labels: _os=linux
  lookup: sum -10m unaligned of kills
   units: kills
   every: 1m
    crit: $this > 0
   delay: down 1h
 summary: Wings node OOM kills
    info: The Linux OOM killer has terminated one or more processes in the last 10 minutes. Game servers may have crashed. Provision a new Wings node immediately.
      to: sysadmin
